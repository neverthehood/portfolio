<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Content Management — One Motion</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; padding: 40px; color: #111; }
        .admin-panel { max-width: 500px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        h2 { font-weight: 600; margin-bottom: 25px; font-size: 20px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; opacity: 0.6; }
        input, select { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 12px; background: #fafafa; font-family: inherit; }
        button.main-btn { background: #2F5BFF; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 12px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        .list { margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; }
        .item { background: #fff; padding: 12px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .del-btn { color: #ff4d4d; cursor: pointer; border: none; background: none; font-weight: 600; }
        .hint { font-size: 11px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>

<div class="admin-panel">
    <h2>New case (Services)</h2>
    <div class="input-group">
        <label>Category</label>
        <select id="category">
            <option value="Product Design">Product Design</option>
            <option value="Development">Development</option>
            <option value="3D & Motion">3D & Motion</option>
            <option value="Brand Identity">Brand Identity</option>
        </select>
    </div>
    <div class="input-group">
        <label>Project Title</label>
        <input type="text" id="title" placeholder="e.g. Fintech App">
    </div>
    <div class="input-group">
        <label>Tags (comma separated)</label>
        <input type="text" id="tags" placeholder="e.g. UI/UX, Mobile">
    </div>
    <div class="input-group">
        <label>Media file (Render_1.png or video.mp4)</label>
        <input type="text" id="img" placeholder="e.g. promo.mp4">
    </div>

    <button class="main-btn" onclick="saveCase()">Add to site</button>

    <div id="cases-list"></div>
    <button class="main-btn" onclick="addCase()">Add Case</button>
<button class="main-btn" style="background: #111; margin-top: 10px;" onclick="exportJSON()">Export JSON for prod</button>

    <div id="output-box" style="display:none; margin-top:30px;">
    <label>Copy this code and paste into services.json:</label>
    <textarea id="json-output" style="width:100%; height:300px; margin-top:10px;"></textarea>
    </div>
</div>

    <script>
        let currentData = {
            "Product Design": [],
            "Development": [],
            "3D & Motion": [],
            "Brand Identity": []
        };

        function saveCase() {
            const cat = document.getElementById('category').value;
            const title = document.getElementById('title').value;
            const tags = document.getElementById('tags').value.split(',').map(s => s.trim()).filter(Boolean);
            const img = document.getElementById('img').value;

            if(!title || !img) return alert('Fill in the title and filename');

            currentData[cat].push({ title, tags, img });
            renderList();
        }

        function renderList() {
            const list = document.getElementById('cases-list');
            list.innerHTML = '<h3>Added cases:</h3>';
            
            for(let cat in currentData) {
                currentData[cat].forEach((item, index) => {
                    list.innerHTML += `
                        <div class="case-item">
                            <b>[${cat}]</b> ${item.title}
                            <button class="del-btn" onclick="deleteCase('${cat}', ${index})">Delete</button>
                        </div>
                    `;
                });
            }
        }

        function deleteCase(cat, index) {
            if(!confirm('Delete this case?')) return;
            currentData[cat].splice(index, 1);
            renderList();
        }

        function exportJSON() {
            // Output data to console or special textarea
            console.log("Copy this to services.json:", currentData);
            alert("JSON ready! Check console (F12) and copy text to services.json");

            const outputBox = document.getElementById('output-box');
            const output = document.getElementById('json-output');

            if(Object.values(currentData).flat().length === 0) {
                alert("Database is empty! Add at least one case.");
                return;
            }

            // Format JSON to be pretty (with indents)
            output.value = JSON.stringify(currentData, null, 4);
            outputBox.style.display = 'block';
            output.select(); // Select text for copying
        }
    </script>
</body>
</html>
