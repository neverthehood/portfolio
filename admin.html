<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление контентом — One Motion</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; padding: 40px; color: #111; }
        .admin-panel { max-width: 500px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        h2 { font-weight: 600; margin-bottom: 25px; font-size: 20px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; opacity: 0.6; }
        input, select { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 12px; background: #fafafa; font-family: inherit; }
        button.main-btn { background: #2F5BFF; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 12px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        .list { margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; }
        .item { background: #fff; padding: 12px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .del-btn { color: #ff4d4d; cursor: pointer; border: none; background: none; font-weight: 600; }
        .hint { font-size: 11px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>

<div class="admin-panel">
    <h2>Новый кейс (Services)</h2>
    
    <div class="input-group">
        <label>Категория</label>
        <select id="category">
            <option value="graphic">Graphic Design</option>
            <option value="web">Web Design</option>
            <option value="threeD">3D Design</option>
            <option value="motion">Motion Design</option>
        </select>
    </div>

    <div class="input-group">
        <label>Название проекта</label>
        <input type="text" id="title" placeholder="Skinz Visual System">
    </div>

    <div class="input-group">
        <label>Теги (через запятую)</label>
        <input type="text" id="tags" placeholder="Branding, 3D Assets">
    </div>

    <div class="input-group">
        <label>Файл медиа (Render_1.png или video.mp4)</label>
        <input type="text" id="img" placeholder="Например: promo.mp4">
    </div>

    <button class="main-btn" onclick="saveCase()">Добавить на сайт</button>

    <div class="list" id="caseList"></div>
</div>

<script>
    function saveCase() {
        const category = document.getElementById('category').value;
        const title = document.getElementById('title').value;
        const tags = document.getElementById('tags').value.split(',').map(t => t.trim());
        const img = document.getElementById('img').value;

        if(!title || !img) return alert('Заполните название и имя файла');

        let db = JSON.parse(localStorage.getItem('onemotion_db')) || { graphic: [], web: [], threeD: [], motion: [] };
        
        db[category].push({ title, tags, img });
        localStorage.setItem('onemotion_db', JSON.stringify(db));
        
        document.getElementById('title').value = '';
        document.getElementById('img').value = '';
        document.getElementById('tags').value = '';
        
        renderList();
    }

    function renderList() {
        const db = JSON.parse(localStorage.getItem('onemotion_db')) || { graphic: [], web: [], threeD: [], motion: [] };
        const list = document.getElementById('caseList');
        list.innerHTML = '<h3>Добавленные кейсы:</h3>';
        
        for (let cat in db) {
            db[cat].forEach((item, index) => {
                list.innerHTML += `<div class="item">
                    <span><b>${cat}:</b> ${item.title}</span>
                    <button class="del-btn" onclick="deleteCase('${cat}', ${index})">Удалить</button>
                </div>`;
            });
        }
    }

    function deleteCase(cat, index) {
        if(!confirm('Удалить этот кейс?')) return;
        let db = JSON.parse(localStorage.getItem('onemotion_db'));
        db[cat].splice(index, 1);
        localStorage.setItem('onemotion_db', JSON.stringify(db));
        renderList();
    }

    renderList();

    function generateJSON() {
        const currentData = localStorage.getItem('onemotion_db');
        // Выводим данные в консоль или в специальное текстовое поле (textarea)
        console.log("Скопируй это в services.json:", currentData);
        alert("JSON готов! Проверь консоль (F12) и скопируй текст в services.json");
    }
    
</script>
</body>
</html>
